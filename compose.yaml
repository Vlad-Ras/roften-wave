services:
  wave:
    build: .
    container_name: roften-wave
    restart: unless-stopped
    env_file: .env
    init: true
    ports:
      # Only nginx on host can access the admin panel.
      - "127.0.0.1:8787:8787"
    volumes:
      - wave_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  wave_data:
