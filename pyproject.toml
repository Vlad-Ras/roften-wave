[project]
name = "roften-wave"
version = "0.1.3"
description = "Self-hosted Yandex Music radio control for AzuraCast and Telegram"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "yandex-music>=3.2.0,<4",
  "aiogram>=3.15,<4",
  "itsdangerous>=2.2,<3",
  "httpx>=0.27,<1",
]
[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["roften_wave*"]
exclude = ["tests*", "deploy*", "data*"]

[tool.setuptools.package-data]
roften_wave = ["static/*.html", "static/*.css", "static/*.js"]
