name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - name: Check no secrets, local databases or audio were committed
        run: |
          test ! -f .env
          test -z "$(git ls-files -- '*.mp3' '*.sqlite*' '.env')"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Python dependencies
        run: python -m pip install -e '.[test]'
      - name: Unit and local integration tests
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q roften_wave
      - name: Static JavaScript and Bash checks
        run: |
          node --check roften_wave/static/app.js
          bash -n deploy/preflight.sh deploy/render-domain.sh deploy/publish-github.sh deploy/remote-deploy.sh
      - name: Docker build
        if: matrix.python-version == '3.12'
        run: docker build -t roften-wave:ci .
