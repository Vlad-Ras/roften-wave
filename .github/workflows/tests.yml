name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - name: Check no secrets, local databases or audio were committed
        run: |
          test ! -f .env
          test -z "$(git ls-files -- '*.mp3' '*.sqlite*' '.env')"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Python dependencies
        run: python -m pip install -e '.[test]'
      - name: Unit and local integration tests
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q roften_wave
      - name: Static JavaScript and Bash checks
        run: |
          node --check roften_wave/static/app.js
          bash -n deploy/preflight.sh deploy/render-domain.sh deploy/publish-github.sh deploy/remote-deploy.sh
      - name: Set up Docker Buildx
        if: matrix.python-version == '3.12'
        uses: docker/setup-buildx-action@v3
      - name: Docker build (shared BuildKit cache)
        if: matrix.python-version == '3.12'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: roften-wave:ci
          cache-from: type=gha,scope=roften-wave-ci
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=roften-wave-ci,mode=max' || '' }}
